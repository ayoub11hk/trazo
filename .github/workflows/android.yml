name: Trazo CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Núcleo (GPS, viajes, estadísticas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - run: gradle -p core test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: core-test-results, path: core/build/test-results }

  backend-tests:
    name: Backend (reglas de acceso SQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar pruebas de acceso
        env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
        run: bash supabase/tests/run.sh

  android:
    name: APK
    runs-on: ubuntu-latest
    needs: [core-tests]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Compilar APK de depuración
        env:
          # Public values only (project URL and anon key). Without them the app asks for them on first launch.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          gradle assembleDebug lintDebug --continue 2>&1 | tee build.log
      - name: Resumen de errores de compilación
        if: failure()
        run: |
          grep -E '^(e|w): file' build.log | grep '^e:' | sed 's#file:///home/runner/work/trazo/trazo/##' | sort -u | head -300 || true
          grep -E 'What went wrong' -A12 build.log | head -80 || true
      - uses: actions/upload-artifact@v4
        with: { name: trazo-debug-apk, path: app/build/outputs/apk/debug/*.apk }
      - name: Publicar APK de prueba en Releases (descarga directa desde el móvil)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk trazo-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest trazo-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "Trazo (versión de prueba)" \
            --notes "APK de depuración generado automáticamente desde ${GITHUB_SHA::7}. Instálalo en Android 8 o superior."
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lint-report, path: app/build/reports/lint-results-debug.html }
      - name: Compilar APK de release firmado
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.TRAZO_KEYSTORE_B64 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TRAZO_KEYSTORE_PASSWORD: ${{ secrets.TRAZO_KEYSTORE_PASSWORD }}
          TRAZO_KEY_ALIAS: ${{ secrets.TRAZO_KEY_ALIAS }}
          TRAZO_KEY_PASSWORD: ${{ secrets.TRAZO_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/trazo.jks"
          TRAZO_KEYSTORE_FILE="$RUNNER_TEMP/trazo.jks" gradle assembleRelease
          rm -f "$RUNNER_TEMP/trazo.jks"
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('app/build/outputs/apk/release/*.apk') != '' }}
        with: { name: trazo-release-apk, path: app/build/outputs/apk/release/*.apk }
